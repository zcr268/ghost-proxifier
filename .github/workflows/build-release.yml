name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package core CLI
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build\${{ env.BUILD_TYPE }}\ghost-proxifier.exe" $dist
          Copy-Item "build\${{ env.BUILD_TYPE }}\ghost_core.dll" $dist
          Copy-Item "ghost.conf.example" $dist
          Copy-Item "README.md" $dist
          Compress-Archive -Path "$dist\*" -DestinationPath "ghost-proxifier-windows-x64.zip" -Force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Tauri resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin" | Out-Null
          Copy-Item "build\${{ env.BUILD_TYPE }}\ghost-proxifier.exe" "bin\ghost-proxifier.exe" -Force
          Copy-Item "build\${{ env.BUILD_TYPE }}\ghost_core.dll" "bin\ghost_core.dll" -Force

      - name: Build Tauri UI
        run: |
          npm ci
          npm run tauri -- build

      - name: Package Tauri UI bundles
        shell: pwsh
        run: |
          $bundleDir = "src-tauri\target\release\bundle"
          if (Test-Path $bundleDir) {
            Compress-Archive -Path "$bundleDir\*" -DestinationPath "ghost-proxifier-tauri-ui-windows-x64.zip" -Force
          } else {
            Write-Error "Tauri bundle directory not found: $bundleDir"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-proxifier-windows-x64
          path: ghost-proxifier-windows-x64.zip

      - name: Upload Tauri UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-proxifier-tauri-ui-windows-x64
          path: ghost-proxifier-tauri-ui-windows-x64.zip

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            $tag = "build-$env:GITHUB_RUN_NUMBER-$shortSha"
          }
          gh release create $tag `
            "ghost-proxifier-windows-x64.zip" `
            "ghost-proxifier-tauri-ui-windows-x64.zip" `
            --target "$env:GITHUB_SHA" `
            --title "Ghost Proxifier $tag" `
            --notes "Automated Windows x64 build with Tauri UI."
